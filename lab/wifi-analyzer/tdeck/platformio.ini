; LilyGO T-Deck Wi-Fi analyzer (ESP32-S3FN16R8: 16 MB flash, 8 MB octal PSRAM).
; Build with ./build.sh, which fetches LilyGO's T-Deck repo (for its patched TFT_eSPI) and merges the image.
;
; Platform pinned to 6.4.0 = Arduino core 2.0.11. LilyGO's README: their TFT_eSPI does not work above core 2.0.14
; (TFT_eSPI issue #3329), and the newest official platform (7.1.3) ships 2.0.17. LilyGO themselves pin 6.3.0 (2.0.9).

[env:tdeck]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
; ../common holds wifilogic (channel names, log lines, group frames). TDECK_LILYGO_LIB is LilyGO's lib/ folder,
; set by build.sh; only its TFT_eSPI is used (Setup210_LilyGo_T_Deck.h is selected there).
lib_extra_dirs =
    ../common
    ${sysenv.TDECK_LILYGO_LIB}
lib_ldf_mode = chain+
monitor_speed = 115200
