# Wi-Fi analyzer (lab/wifi-analyzer/pi5): NetworkManager leaves the built-in Wi-Fi alone. Otherwise, while not
# connected, it keeps scanning actively (probe requests) to find networks, which breaks the listen-only rule.
# To let this Pi join your own network as well, set WIFI_CLIENT=yes in /boot/firmware/wifi-analyzer.conf.
[keyfile]
unmanaged-devices=interface-name:wlan0
