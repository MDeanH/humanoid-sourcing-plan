# Wi-Fi analyzer settings for the Raspberry Pi 5. This file is on the SD card's boot partition, so any computer
# can edit it. Changes apply at the next boot (or: sudo systemctl restart wifi-analyzer-scan).

# Wi-Fi interface to scan with. wlan0 is the Pi 5's own (2.4 and 5 GHz). A USB adapter that does 6 GHz is wlan1.
IFACE=wlan0

# Seconds between passive scans (5 or more). A passive pass over 2.4 and 5 GHz takes several seconds.
SCAN_EVERY=10

# Two-letter country for the radio's rules. 5 GHz channels stay off until it is set.
COUNTRY=US

# Run name: auto makes pi5-b<boot number>-<date> per boot. Or a fixed name, e.g. RUN=hall-a-loadin
RUN=auto

# no: this Pi never joins a Wi-Fi network (reach it by USB tethering or Ethernet). yes: NetworkManager may join
# your network on wlan0, and will scan actively while it looks for one.
WIFI_CLIENT=no
